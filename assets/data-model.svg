<text class="lg" x="52" y="528">observability <tspan fill="#94A3B8">5</tspan></text>
<rect x="165" y="517" width="13" height="13" rx="3" fill="#FFFBEB" stroke="#FDE68A"/>
<text class="lg" x="185" y="528">inventory <tspan fill="#94A3B8">5</tspan></text>
<rect x="272" y="517" width="13" height="13" rx="3" fill="#FFF1F2" stroke="#FECDD3"/>
<text class="lg" x="292" y="528">alerting <tspan fill="#94A3B8">4</tspan></text>
