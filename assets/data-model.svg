<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 664" width="1240" height="664" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>The 23-table data model</title>
<desc>Twenty-three tables across six business domains, joined by thirty-four declared relationships. Every edge points from the many side to the one side.</desc>
