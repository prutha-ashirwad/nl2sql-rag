<text class="lg" x="633" y="528">procurement <tspan fill="#94A3B8">1</tspan></text>
<path class="inner" d="M32 566 H72"/>
<text class="lg" x="80" y="570">INNER — 21 of the 34</text>
<path class="left" d="M250 566 H290"/>
<text class="lg" x="298" y="570">LEFT — 13, where the right-hand row may not exist</text>
<text class="bd" x="32" y="604">Every relationship is <tspan font-style="italic">many-to-one</tspan>, and the 34 foreign keys declared across the table files map one-to-one onto these 34 relationships — no key without a join, no join without a key.</text>
<text class="bd" x="32" y="624">An invariant test fails the build the moment that stops being true, because a missing relationship would not raise an error: the join planner would quietly route around it and answer a different question.</text>
