 .left  { stroke: #94A3B8; stroke-width: 1.15; fill: none; opacity: .75; stroke-dasharray: 4 3; }
</style>
<rect width="1240" height="664" fill="#FFFFFF"/>
<text class="t" x="32" y="44">The data model the agent reasons over</text>
<text class="sub" x="32" y="68">23 tables across 6 business domains, joined by 34 declared relationships. Laid out so every edge runs left to right, from the many side to the one side.</text>
