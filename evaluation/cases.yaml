# Held-out evaluation set.
#
# Each case is a question plus the reference SQL that answers it. The harness runs
# both the reference query and the query the system generates, then compares the
# result sets — so a query written differently from the reference still counts as
# correct if it returns the same rows. Run it with `make eval`.
#
# These questions are deliberately NOT the twelve curated examples in
# knowledge_base/data/example_queries.yaml. Those sit inside the retrieval corpus as
# few-shot prompts, so scoring against them would measure prompt recall rather than
# generalisation. A test in tests/test_evaluation.py enforces that separation.
#
# Reference queries follow the same house rules the system is held to (sql_rules.yaml):
# default filters on devices/sites/alert_rules/slo_targets, LEFT JOIN on nullable
# foreign keys, exact uppercase enum literals, and no LIMIT unless the question names
# a number.

cases:
  # ── lookup ──────────────────────────────────────────────────────
  - id: EV-L01
    question: "Show me the uplink ports at our Dublin 1 data centre, the device each one belongs to, and the speed it is running at."
    category: lookup
    required_tables: [interfaces, devices, sites]
    note: >-
      Plain filtered list, no aggregation and no LIMIT (RULE-003 - no number named).
      Exercises the two-hop declared path interfaces -> devices -> sites (both INNER per
      relationships.yaml) and both RULE-015 default filters (devices.device_status <>
      'DECOMMISSIONED', sites.is_active = TRUE). Site can be resolved via s.site_name =
      'Dublin 1' or s.site_code = 'DUB1' - both yield the identical 18 rows, so either is
      gradeable. Descriptive columns (device_name, interface_name) are returned instead of
      device_id / interface_id per RULE-014.
    gold_sql: |
      SELECT d.device_name, i.interface_name, i.speed_mbps
      FROM interfaces i
      INNER JOIN devices d ON i.device_id = d.device_id
      INNER JOIN sites s ON d.site_id = s.site_id
      WHERE i.is_uplink = TRUE
        AND s.site_name = 'Dublin 1'
        AND d.device_status <> 'DECOMMISSIONED'
        AND s.is_active = TRUE

  - id: EV-L02
    question: "Which incidents have been raised in the past 10 days? Show the incident reference, the environment it affected and the team responsible."
    category: lookup
    required_tables: [incidents, environments, teams]
    note: >-
      Tests the declared join types exactly: incident_affects_environment is INNER,
      incident_owned_by_team is LEFT (nullable owner_team_id). Time window is relative to
      now on incidents.opened_at per RULE-009, never a literal date. 10 days was chosen
      deliberately over 7 or 14: the nearest incident inside the window sits 26 hours clear
      of the boundary and the nearest outside one over a day clear, so the row count does
      not drift during a benchmark run. No LIMIT - no number named.
    gold_sql: |
      SELECT inc.incident_key, e.environment_name, t.team_name
      FROM incidents inc
      INNER JOIN environments e ON inc.environment_id = e.environment_id
      LEFT JOIN teams t ON inc.owner_team_id = t.team_id
      WHERE inc.opened_at >= datetime('now', '-10 days')

  - id: EV-L03
    question: "List every firewall in the fleet with its hostname, the model it is, and the vendor that makes it."
    category: lookup
    required_tables: [devices, device_models, vendors]
    note: >-
      The word 'firewall' must be resolved onto device_models.device_category, not onto
      anything on devices - devices has no category column, so a system that guesses at a
      device-level attribute fails. device_category's allowed_values are declared lowercase,
      so the correct literal is 'firewall' (a blind uppercase-everything reading of RULE-008
      returns 0 rows). Two-hop INNER path device_has_model -> model_supplied_by_vendor.
      Devices default filter applied. The one DECOMMISSIONED device (sin1-core-101) is a
      switch, so the filter does not change the row count here - it is a correctness check,
      not a discriminator.
    gold_sql: |
      SELECT d.device_name, dm.model_name, v.vendor_name
      FROM devices d
      INNER JOIN device_models dm ON d.model_id = dm.model_id
      INNER JOIN vendors v ON dm.vendor_id = v.vendor_id
      WHERE dm.device_category = 'firewall'
        AND d.device_status <> 'DECOMMISSIONED'

  - id: EV-L04
    question: "What success rate have we committed to for latency probes in each environment?"
    category: lookup
    required_tables: [slo_targets, environments, observation_types]
    note: >-
      Reads a committed target straight off slo_targets - no success rate is computed from
      observations here, so RULE-013 must NOT fire. Requires the slo_targets default filter
      st.is_active = TRUE (RULE-015). 'Latency probes' resolves to ot.type_code =
      'LATENCY_PROBE' or equivalently ot.type_name = 'Latency probe'; both return the same 4
      rows. Grain of slo_targets is one row per environment x observation type, so filtering
      to one type gives exactly one row per environment with no aggregation needed. Values
      differ per environment (99.9 / 99.0 / 95.0 / 95.0) so a wrong environment join is
      visible in the result.
    gold_sql: |
      SELECT e.environment_name, st.target_success_rate
      FROM slo_targets st
      INNER JOIN environments e ON st.environment_id = e.environment_id
      INNER JOIN observation_types ot ON st.observation_type_id = ot.observation_type_id
      WHERE ot.type_code = 'LATENCY_PROBE'
        AND st.is_active = TRUE

  # ── enum_filter ─────────────────────────────────────────────────
  - id: EV-E01
    question: "Which alerts have been silenced? Show the device each one fired on and when it was raised."
    category: enum_filter
    required_tables: [alerts, devices]
    note: >-
      The everyday word 'silenced' is a declared value_synonym of alerts.alert_status =
      'SUPPRESSED' (alerting.yaml lists silenced/muted/suppressed). The exact uppercase
      literal is required per RULE-008; 'suppressed', 'Silenced' or 'MUTED' all return 0
      rows. Distractor risk: 'silenced' must not be mapped to RESOLVED or to a rule-level
      mute (alert_rules.is_enabled) - alert_rules is not joined at all here, so its default
      filter does not apply. Joins alerts -> devices along the declared INNER shortcut
      alert_raised_on_device, with the devices default filter. Deliberately kept clear of
      held-out #7, which is about OPEN critical unacknowledged alerts.
    gold_sql: |
      SELECT d.device_name, a.triggered_at
      FROM alerts a
      INNER JOIN devices d ON a.device_id = d.device_id
      WHERE a.alert_status = 'SUPPRESSED'
        AND d.device_status <> 'DECOMMISSIONED'

  - id: EV-E02
    question: "Which ports are currently reporting their link as down, and which device is each one on?"
    category: enum_filter
    required_tables: [interfaces, devices]
    note: >-
      The core trap: interfaces declares DOWN as an allowed value on BOTH admin_status and
      oper_status, but only oper_status carries the value_synonyms [down, offline, link
      down], and the YAML comment states an unqualified 'down' means the link is really
      down, not administratively shut. 'reporting their link as down' points at oper_status.
      Filtering admin_status = 'DOWN' instead returns 0 rows (every interface is admin UP),
      and filtering both is also empty - so this cleanly separates a system that reads the
      curated synonyms from one that pattern-matches the column list. Uppercase literal
      required (RULE-008). Devices default filter applied.
    gold_sql: |
      SELECT d.device_name, i.interface_name
      FROM interfaces i
      INNER JOIN devices d ON i.device_id = d.device_id
      WHERE i.oper_status = 'DOWN'
        AND d.device_status <> 'DECOMMISSIONED'

  - id: EV-E03
    question: "Over the last 7 days, which three kinds of checks came back partially impaired most often, and how many times each?"
    category: enum_filter
    required_tables: [observations, observation_types]
    note: >-
      'Partially impaired' is a declared value_synonym of observations.status = 'DEGRADED'
      ([degraded, partial, impaired]); the strong distractor is FAILED, which is a different
      literal and a much larger bucket. Exact uppercase literal per RULE-008. The question
      names three, so LIMIT 3 is licensed by RULE-003, and the ranking follows RULE-011
      (aliased aggregate, ORDER BY that alias DESC). Relative window on observed_at per
      RULE-009. No devices or sites joined, so no default filters apply, and failure_reasons
      is deliberately not joined - DEGRADED rows carry no failure reason. Ranking is
      unambiguous: 38 / 28 / 21 against a 4th place of 17, a wide enough gap that the top
      three do not reorder as the rolling window slides.
    gold_sql: |
      SELECT ot.type_name, COUNT(*) AS observation_count
      FROM observations o
      INNER JOIN observation_types ot ON o.observation_type_id = ot.observation_type_id
      WHERE o.status = 'DEGRADED'
        AND o.observed_at >= datetime('now', '-7 days')
      GROUP BY ot.type_name
      ORDER BY observation_count DESC
      LIMIT 3

  # ── aggregate ───────────────────────────────────────────────────
  - id: EV-A01
    question: "How many monitoring checks of each kind did we run over the past 7 days?"
    category: aggregate
    required_tables: [observations, observation_types]
    note: >-
      Simplest grouped count. Exercises RULE-009 (relative window on observed_at; 2440 of
      6000 rows fall inside it, so ignoring the window is detectable) and RULE-014 (group by
      the descriptive type_name, not observation_type_id). No LIMIT because no number is
      named (RULE-003). No default filter applies: neither devices, sites, alert_rules nor
      slo_targets is joined. Verified: 6 rows, e.g. ('Link state poll', 632), ('Latency
      probe', 624), ('Packet loss sample', 321).
    gold_sql: |
      SELECT ot.type_name,
             COUNT(*) AS observation_count
      FROM observations o
      INNER JOIN observation_types ot ON o.observation_type_id = ot.observation_type_id
      WHERE o.observed_at >= datetime('now', '-7 days')
      GROUP BY ot.type_name
      ORDER BY observation_count DESC

  - id: EV-A02
    question: "How reliable has each geographic region been over the last 14 days, measured by success rate?"
    category: aggregate
    required_tables: [observations, devices, sites, regions]
    note: >-
      The RULE-013 case. Three-hop join along declared relationships
      observation_recorded_on_device -> device_installed_at_site -> site_located_in_region,
      all INNER per relationships.yaml. Both RULE-015 default filters fire (devices and
      sites), and the devices one is discriminating: without it Asia Pacific South reads
      72.91 instead of 73.16 (the DECOMMISSIONED device carries 140 observations). Alias and
      ROUND(...,2) follow the declared metric_expression / metric_alias for 'success rate'
      in business_glossary.yaml. Verified: 4 rows - ('US West', 73.74), ('EU West', 73.61),
      ('Asia Pacific South', 73.16), ('US East', 70.77).
    gold_sql: |
      SELECT r.region_name,
             ROUND(100.0 * SUM(CASE WHEN o.status = 'SUCCESS' THEN 1 ELSE 0 END) / COUNT(*), 2) AS success_rate_pct
      FROM observations o
      INNER JOIN devices d ON o.device_id = d.device_id
      INNER JOIN sites s ON d.site_id = s.site_id
      INNER JOIN regions r ON s.region_id = r.region_id
      WHERE o.observed_at >= datetime('now', '-14 days')
        AND d.device_status <> 'DECOMMISSIONED'
        AND s.is_active = TRUE
      GROUP BY r.region_name
      ORDER BY success_rate_pct DESC

  - id: EV-A03
    question: "On average, how long do our monitoring checks take on each category of hardware?"
    category: aggregate
    required_tables: [observations, devices, device_models]
    note: >-
      The AVG case. Groups on device_models.device_category (router/switch/firewall), a
      declared enum dimension rather than a surrogate key. RULE-015 devices filter is
      discriminating: without it the switch average reads 1244.88 instead of 1242.66.
      duration_ms has no NULLs (6000/6000 populated), so AVG semantics are unambiguous.
      ROUND(...,2) matches the house convention used by every metric_expression in
      business_glossary.yaml. Verified: 3 rows - ('firewall', 1281.54), ('switch', 1242.66),
      ('router', 1238.54).
    gold_sql: |
      SELECT dm.device_category,
             ROUND(AVG(o.duration_ms), 2) AS avg_duration_ms
      FROM observations o
      INNER JOIN devices d ON o.device_id = d.device_id
      INNER JOIN device_models dm ON d.model_id = dm.model_id
      WHERE d.device_status <> 'DECOMMISSIONED'
      GROUP BY dm.device_category
      ORDER BY avg_duration_ms DESC

  - id: EV-A04
    question: "What is the combined link speed of all the ports on each device?"
    category: aggregate
    required_tables: [interfaces, devices]
    note: >-
      The SUM case, and the only one that never touches the observations fact table - it
      aggregates the inventory side along interface_belongs_to_device (INNER). speed_mbps is
      non-null on all 189 interfaces. RULE-015 devices filter is discriminating on row
      count: 44 devices with the filter, 45 without. device_name is unique (45 distinct of
      45 rows), so grouping by the descriptive column is safe. Verified: 44 rows, e.g.
      ('sfo2-edge-102', 440000), ('iad2-fw-104', 260000), ('iad1-edge-102', 260000).
    gold_sql: |
      SELECT d.device_name,
             SUM(i.speed_mbps) AS total_speed_mbps
      FROM interfaces i
      INNER JOIN devices d ON i.device_id = d.device_id
      WHERE d.device_status <> 'DECOMMISSIONED'
      GROUP BY d.device_name
      ORDER BY total_speed_mbps DESC

  - id: EV-A05
    question: "How many alerts has each alert rule fired in the past 7 days?"
    category: aggregate
    required_tables: [alerts, alert_rules]
    note: >-
      Moves the aggregate into the alerting domain. RULE-009 applies to alerts.triggered_at
      rather than observed_at (148 of 400 alerts fall in the window, so the window is
      discriminating). RULE-015 adds the alert_rules is_enabled filter; note this filter
      happens to be a no-op on the seeded data because the single disabled rule has never
      fired, so it cannot be used to distinguish correct from incorrect systems here - the
      time window is the real discriminator. Verified: 6 rows - ('BGP session down', 29),
      ('Rising error counters', 28), ('Packet loss above 2%', 28), ('Throughput below 100
      Mbps', 24), ('Interface down', 22), ('Latency above 200ms', 17).
    gold_sql: |
      SELECT ar.rule_name,
             COUNT(*) AS alert_count
      FROM alerts a
      INNER JOIN alert_rules ar ON a.rule_id = ar.rule_id
      WHERE ar.is_enabled = TRUE
        AND a.triggered_at >= datetime('now', '-7 days')
      GROUP BY ar.rule_name
      ORDER BY alert_count DESC

  # ── ranking ─────────────────────────────────────────────────────
  - id: EV-R01
    question: "Which 3 regions have recorded the most failed checks?"
    category: ranking
    required_tables: [observations, devices, sites, regions]
    note: >-
      Four-hop ranking along declared INNER relationships observation_recorded_on_device ->
      device_installed_at_site -> site_located_in_region (RULE-006). Applies both default
      filters for the joined tables, devices.device_status <> 'DECOMMISSIONED' and
      sites.is_active = TRUE (RULE-015), and the uppercase enum literal 'FAILED' (RULE-008).
      No time window because the question names none (no invented predicate), and LIMIT 3
      only because the question says three (RULE-003, RULE-011: aggregate aliased
      failure_count and ordered by that alias descending). TIE CHECK: I ran the aggregate
      without the LIMIT. Counts are US East 447, US West 225, EU West 217, Asia Pacific
      South 189 -- all four values distinct and the cut-off is 217 vs 189, a gap of 28, so
      the top 3 membership and ordering are both unambiguous. Verified: returns exactly 3
      rows. Also checked that dropping the default filters would not change this result (the
      one DECOMMISSIONED device, sin1-core-101, has 140 observations but its region is not
      near the cut-off), so a system that omits them is not unfairly failed here.
    gold_sql: |
      SELECT r.region_name,
             COUNT(*) AS failure_count
      FROM observations o
      INNER JOIN devices d ON o.device_id = d.device_id
      INNER JOIN sites s ON d.site_id = s.site_id
      INNER JOIN regions r ON s.region_id = r.region_id
      WHERE o.status = 'FAILED'
        AND d.device_status <> 'DECOMMISSIONED'
        AND s.is_active = TRUE
      GROUP BY r.region_name
      ORDER BY failure_count DESC
      LIMIT 3

  - id: EV-R02
    question: "Which 5 devices have raised the most alerts?"
    category: ranking
    required_tables: [alerts, devices]
    note: >-
      Uses the declared alert_raised_on_device relationship (INNER, the denormalised
      alerts.device_id shortcut) rather than routing back through the triggering observation
      (RULE-006). devices is joined so its default filter applies (RULE-015).
      alerts.device_id is NOT NULL, so INNER is correct here and no LEFT JOIN is owed. LIMIT
      5 comes straight from the stated number (RULE-003) and the aggregate is aliased and
      ordered by the alias (RULE-011). TIE CHECK: I ran the aggregate without the LIMIT
      across all 44 non-decommissioned devices. The cut-off is unambiguous -- rank 5 has 19
      alerts... precisely, counts are 19, 19, 18, 17, 17 then 16 at rank 6, so rank 5 = 17
      and rank 6 = 16 are distinct and the top-5 membership set is deterministic. There are
      ties WITHIN the returned set (sfo2-fw-104 and iad2-core-201 both 19; iad2-core-105 and
      iad1-core-101 both 17), so the relative order of those pairs is arbitrary -- the
      result SET is deterministic but the row order within tied pairs is not, which matters
      only if the grader compares ordered lists rather than sets. Verified: returns exactly
      5 rows. The decommissioned device has only 7 alerts, so the default filter does not
      alter the top 5.
    gold_sql: |
      SELECT d.device_name,
             COUNT(*) AS alert_count
      FROM alerts a
      INNER JOIN devices d ON a.device_id = d.device_id
      WHERE d.device_status <> 'DECOMMISSIONED'
      GROUP BY d.device_name
      ORDER BY alert_count DESC
      LIMIT 5

  - id: EV-R03
    question: "Which 5 alert rules have fired the most alerts?"
    category: ranking
    required_tables: [alerts, alert_rules]
    note: >-
      Noisy-rule ranking over the declared alert_raised_by_rule relationship (INNER,
      RULE-006), with the alert_rules default filter ar.is_enabled = TRUE applied because
      that table is joined (RULE-015). No time window is invented and LIMIT 5 matches the
      stated number (RULE-003, RULE-011). TIE CHECK: I ran the aggregate without the LIMIT.
      Across the 6 enabled rules the counts are 73, 68, 68, 67, 64, 60, so rank 5 = 64 and
      rank 6 = 60 are distinct (gap of 4) and the top-5 membership is unambiguous. The tie
      at 68 ('Rising error counters' and 'Interface down') sits inside the returned set, not
      at the cut-off, so it does not change which rows come back -- only the order of those
      two rows is arbitrary. Verified: returns exactly 5 rows. Note the one disabled rule
      ('Legacy latency rule', rule_id 7) has zero alerts in the data, so the is_enabled
      filter is a no-op on the result -- a system that forgets RULE-015 here still matches,
      which keeps the case lenient rather than unfair.
    gold_sql: |
      SELECT ar.rule_name,
             COUNT(*) AS alert_count
      FROM alerts a
      INNER JOIN alert_rules ar ON a.rule_id = ar.rule_id
      WHERE ar.is_enabled = TRUE
      GROUP BY ar.rule_name
      ORDER BY alert_count DESC
      LIMIT 5

  - id: EV-R04
    question: "Which 3 collectors have recorded the most observations?"
    category: ranking
    required_tables: [observations, collectors]
    note: >-
      Ranks telemetry agents by volume, which is the usual way to spot an over-loaded or
      silently idle collector. observations.collector_id is a nullable foreign key and the
      declared observation_collected_by_collector relationship specifies LEFT, so the gold
      uses LEFT JOIN (RULE-006, RULE-007). Neither table carries a default filter, and no
      time window or extra predicate is invented (RULE-003); the aggregate is aliased and
      ordered by the alias descending (RULE-011). I confirmed observations.collector_id is
      never NULL in this database (0 of 6000 rows), so the LEFT JOIN produces no stray NULL
      group that could occupy a top-3 slot -- the result is identical under INNER, which
      means the join-type choice cannot unfairly swing the score. TIE CHECK: I ran the
      aggregate without the LIMIT. All five collectors have distinct counts -- 1272, 1229,
      1208, 1184, 1107 -- so there are no ties anywhere, and the cut-off of 1208 vs 1184 is
      a clear gap of 24. Both membership and ordering are fully deterministic. Verified:
      returns exactly 3 rows.
    gold_sql: |
      SELECT c.collector_name,
             COUNT(*) AS observation_count
      FROM observations o
      LEFT JOIN collectors c ON o.collector_id = c.collector_id
      GROUP BY c.collector_name
      ORDER BY observation_count DESC
      LIMIT 3

  # ── time_window ─────────────────────────────────────────────────
  - id: EV-T01
    question: "How many observations have we collected for each type of check over the last 21 days?"
    category: time_window
    required_tables: [observations, observation_types]
    note: >-
      RULE-009 relative window on observations.observed_at; declared INNER join
      observation_has_type. No LIMIT (RULE-003, no number named). No default-filter tables
      are joined. Window is 21 days and observations span 2026-07-07..2026-08-06, so ~4/5 of
      the fact table is inside it (5430 rows); nearest row below the boundary is ~3 minutes
      away and nearest above ~5 minutes, so a millisecond-apart re-run cannot bisect a row.
      Verified 6 rows: Latency probe 1401, Link state poll 1337, Packet loss sample 700,
      Throughput sample 682, Error counter read 655, BGP session check 655.
    gold_sql: |
      SELECT ot.type_name, COUNT(*) AS observation_count
      FROM observations o
      INNER JOIN observation_types ot ON o.observation_type_id = ot.observation_type_id
      WHERE o.observed_at >= datetime('now', '-21 days')
      GROUP BY ot.type_name
      ORDER BY observation_count DESC

  - id: EV-T02
    question: "Over the past 14 days, how many alerts has each alert rule raised?"
    category: time_window
    required_tables: [alerts, alert_rules]
    note: >-
      RULE-009 window applied to alerts.triggered_at (the declared alert timestamp), not
      observed_at. RULE-015 default filter ar.is_enabled = TRUE is applied because
      alert_rules is joined; one of the 7 rules is disabled but it has raised zero alerts,
      so the filter is a no-op on the result set and the case cannot unfairly punish a
      system either way. Nearest alert below the boundary is ~40 minutes earlier and the
      nearest above ~9 hours later, so the window edge is very stable. Verified 6 rows:
      Packet loss above 2% 49, Interface down 47, Throughput below 100 Mbps 45, BGP session
      down 43, Rising error counters 42, Latency above 200ms 40.
    gold_sql: |
      SELECT ar.rule_name, COUNT(*) AS alert_count
      FROM alerts a
      INNER JOIN alert_rules ar ON a.rule_id = ar.rule_id
      WHERE a.triggered_at >= datetime('now', '-14 days')
        AND ar.is_enabled = TRUE
      GROUP BY ar.rule_name
      ORDER BY alert_count DESC

  - id: EV-T03
    question: "How many degraded observations has each region recorded in the last 14 days?"
    category: time_window
    required_tables: [observations, devices, sites, regions]
    note: >-
      Three-hop declared INNER path observation_recorded_on_device ->
      device_installed_at_site -> site_located_in_region. RULE-008 exact enum 'DEGRADED'.
      RULE-009 relative 14-day window. RULE-015 filters on both devices and sites: the
      devices filter is load-bearing here (decommissioned device sin1-core-101 contributes
      11 degraded observations inside the window, which would push Asia Pacific South from
      40 to 51); all 5 sites happen to be active so s.is_active = TRUE is a no-op but is
      still required by the rule. Nearest observation below the boundary is ~45 s earlier
      and the nearest above ~9 minutes later, far wider than the millisecond gap between the
      graded runs. Verified 4 rows: US East 101, US West 58, Asia Pacific South 40, EU West
      36.
    gold_sql: |
      SELECT r.region_name, COUNT(*) AS degraded_count
      FROM observations o
      INNER JOIN devices d ON o.device_id = d.device_id
      INNER JOIN sites s ON d.site_id = s.site_id
      INNER JOIN regions r ON s.region_id = r.region_id
      WHERE o.status = 'DEGRADED'
        AND o.observed_at >= datetime('now', '-14 days')
        AND d.device_status <> 'DECOMMISSIONED'
        AND s.is_active = TRUE
      GROUP BY r.region_name
      ORDER BY degraded_count DESC

  # ── left_join ───────────────────────────────────────────────────
  - id: EV-J01
    question: "Counting every observation we hold, not just the failed ones, how many fall under each failure reason and how many have no failure reason recorded?"
    category: left_join
    required_tables: [observations, failure_reasons]
    note: >-
      RULE-007 / declared LEFT relationship observation_has_failure_reason. 4904 of 6000
      observations have a NULL failure_reason_id, so the LEFT JOIN is what produces the 'no
      reason recorded' group the question explicitly asks for. LEFT JOIN returns 8 rows (7
      reasons plus the NULL group with 4904); INNER JOIN returns 7 rows and drops the
      4904-row group entirely, so INNER is provably a different and wrong answer. No time
      window and no default-filter tables involved, keeping the case focused purely on the
      join type. Verified 8 rows: NULL 4904, Link is down 273, SNMP error returned 144, Poll
      timed out 143, Packet loss detected 138, Authentication failed 138, Latency above
      threshold 133, Device unreachable 127.
    gold_sql: |
      SELECT fr.reason_name, COUNT(*) AS observation_count
      FROM observations o
      LEFT JOIN failure_reasons fr ON o.failure_reason_id = fr.failure_reason_id
      GROUP BY fr.reason_name
      ORDER BY observation_count DESC

  - id: EV-J02
    question: "List the suppressed critical alerts, showing the device each one fired on, when it fired, and the incident it was rolled up into if there was one."
    category: left_join
    required_tables: [alerts, devices, incidents]
    note: >-
      Row-level listing rather than a grouped count, so it exercises LEFT JOIN in a
      different shape from EV-J01. alerts.incident_id is NULL for 334 of 400 alerts
      (RULE-007); declared LEFT relationship alert_belongs_to_incident, and declared INNER
      alert_raised_on_device for the device hop. RULE-008 enums 'SUPPRESSED' and lowercase
      'critical' exactly as declared. RULE-015 devices filter applied; the single
      decommissioned device has zero suppressed critical alerts so it is a no-op on the
      result. LEFT JOIN returns 17 rows; INNER JOIN returns only 4 (just the alerts that
      were rolled into INC-2024-0006, INC-2024-0008 and INC-2024-0016), so the join type
      changes the answer dramatically. triggered_at is included because the question asks
      when it fired and it makes each row uniquely identifiable. Verified 17 rows, 13 of
      which have a NULL incident_key.
    gold_sql: |
      SELECT d.device_name, a.triggered_at, inc.incident_key
      FROM alerts a
      INNER JOIN devices d ON a.device_id = d.device_id
      LEFT JOIN incidents inc ON a.incident_id = inc.incident_id
      WHERE a.alert_status = 'SUPPRESSED'
        AND a.severity = 'critical'
        AND d.device_status <> 'DECOMMISSIONED'
      ORDER BY a.triggered_at DESC

  - id: EV-J03
    question: "How many alerts has each operator acknowledged, and how many alerts has nobody acknowledged?"
    category: left_join
    required_tables: [alerts, users]
    note: >-
      Uses a third distinct nullable foreign key, alerts.acknowledged_by_user_id, whose
      relationship alert_acknowledged_by_user is declared LEFT in relationships.yaml
      (RULE-006 requires the declared join type; the column is nullable and NULL until
      somebody picks the alert up). 154 of 400 alerts are unacknowledged (81 OPEN, 73
      SUPPRESSED). LEFT JOIN returns 9 rows (8 named operators plus the NULL 'nobody' group
      with 154); INNER JOIN returns 8 rows and silently discards the unacknowledged bucket,
      which is exactly the second half of the question. No time window and no default-filter
      tables. Verified 9 rows: NULL 154, Jun Tanaka 46, Rohan Mehta 34, Sami Haddad 33,
      Petra Lindqvist 30, Mariana Duarte 29, Linnea Svensson 29, Karel Novak 28, Amara
      Okafor 17.
    gold_sql: |
      SELECT u.full_name, COUNT(*) AS alert_count
      FROM alerts a
      LEFT JOIN users u ON a.acknowledged_by_user_id = u.user_id
      GROUP BY u.full_name
      ORDER BY alert_count DESC

  # ── multi_hop ───────────────────────────────────────────────────
  - id: EV-M01
    question: "How many checks timed out in each region over the past 30 days?"
    category: multi_hop
    required_tables: [observations, devices, sites, regions]
    note: >-
      Hop path: observations -> devices (observation_recorded_on_device, INNER) -> sites
      (device_installed_at_site, INNER) -> regions (site_located_in_region, INNER); three
      hops, four tables. Geography lives only on regions, so the device and site hops cannot
      be skipped. Exercises RULE-008 with the less common enum literal 'TIMEOUT', RULE-009
      for the rolling window on observed_at, RULE-015 for both the devices and the sites
      default filters (the one DECOMMISSIONED device sits at SIN1 in Asia Pacific South and
      contributes 5 timeouts in the window, so omitting the filter changes the answer), and
      RULE-003 by carrying no LIMIT since no row count was named. Verified: 4 rows - US East
      84, Asia Pacific South 54, EU West 49, US West 38.
    gold_sql: |
      SELECT r.region_name, COUNT(*) AS timeout_count
      FROM observations o
      INNER JOIN devices d ON o.device_id = d.device_id
      INNER JOIN sites s ON d.site_id = s.site_id
      INNER JOIN regions r ON s.region_id = r.region_id
      WHERE o.status = 'TIMEOUT'
        AND o.observed_at >= datetime('now', '-30 days')
        AND d.device_status <> 'DECOMMISSIONED'
        AND s.is_active = TRUE
      GROUP BY r.region_name
      ORDER BY timeout_count DESC

  - id: EV-M02
    question: "Over the last 30 days, how many failed checks did each port type record on equipment in the EU West region?"
    category: multi_hop
    required_tables: [observations, interfaces, interface_types, devices, sites, regions]
    note: >-
      Deepest path in the set - two branches off the fact table: observations -> interfaces
      (observation_belongs_to_interface, INNER) -> interface_types (interface_has_type,
      LEFT) for the port type, and interfaces -> devices (interface_belongs_to_device,
      INNER) -> sites -> regions for the geographic filter; four hops, six tables. Using
      observations.device_id as the shortcut into devices is equivalent here (verified: zero
      rows where interfaces.device_id disagrees with observations.device_id), so either
      device edge grades the same. interface_types is LEFT joined per the declared
      relationship, though no interface has a null type in this data so no NULL bucket
      appears. Filtering on r.region_code = 'eu-west' instead of r.region_name = 'EU West'
      returns the identical result set. Default filters on devices and sites applied per
      RULE-015. Verified: 4 rows - 10GBASE-SR 77, 1000BASE-T 62, 100GBASE-LR4 52, 40GBASE-
      SR4 26.
    gold_sql: |
      SELECT it.type_name, COUNT(*) AS failure_count
      FROM observations o
      INNER JOIN interfaces i ON o.interface_id = i.interface_id
      LEFT JOIN interface_types it ON i.interface_type_id = it.interface_type_id
      INNER JOIN devices d ON i.device_id = d.device_id
      INNER JOIN sites s ON d.site_id = s.site_id
      INNER JOIN regions r ON s.region_id = r.region_id
      WHERE o.status = 'FAILED'
        AND r.region_name = 'EU West'
        AND o.observed_at >= datetime('now', '-30 days')
        AND d.device_status <> 'DECOMMISSIONED'
        AND s.is_active = TRUE
      GROUP BY it.type_name
      ORDER BY failure_count DESC

  - id: EV-M03
    question: "How many critical alerts fired for each kind of monitoring check in the last 30 days?"
    category: multi_hop
    required_tables: [alerts, alert_rules, observation_types]
    note: >-
      Hop path: alerts -> alert_rules (alert_raised_by_rule, INNER) -> observation_types
      (alert_rule_targets_observation_type, INNER); two hops, three tables. The kind of
      check an alert watches is only reachable through the rule, so the intermediate hop
      cannot be short-circuited (alerts has no observation_type_id of its own). Severity is
      filtered with the declared lowercase literal 'critical' per RULE-008 - the enum on
      alerts.severity is lowercase, unlike observations.status - and the alert_rules default
      filter is_enabled = TRUE is applied per RULE-015 (the only disabled rule is 'Legacy
      latency rule', severity low, so it is already excluded by the severity predicate and
      the filter does not shift the numbers). Time window on alerts.triggered_at per
      RULE-009; no LIMIT per RULE-003. Verified: 6 rows - BGP session check 18, Latency
      probe 17, Error counter read 17, Throughput sample 15, Packet loss sample 13, Link
      state poll 9.
    gold_sql: |
      SELECT ot.type_name, COUNT(*) AS alert_count
      FROM alerts a
      INNER JOIN alert_rules ar ON a.rule_id = ar.rule_id
      INNER JOIN observation_types ot ON ar.observation_type_id = ot.observation_type_id
      WHERE a.severity = 'critical'
        AND a.triggered_at >= datetime('now', '-30 days')
        AND ar.is_enabled = TRUE
      GROUP BY ot.type_name
      ORDER BY alert_count DESC

  - id: EV-M04
    question: "For each team, how many incident timeline events were recorded on the production incidents it owns?"
    category: multi_hop
    required_tables: [incident_events, incidents, teams, environments]
    note: >-
      Hop path: incident_events -> incidents (incident_has_timeline_events, INNER) -> teams
      (incident_owned_by_team, LEFT) for ownership, and incidents -> environments
      (incident_affects_environment, INNER) for the production scope; two hops from the fact
      table plus a branch, four tables. Ownership and environment both hang off incidents,
      so incident_events cannot reach either directly. teams is LEFT joined because
      incidents.owner_team_id is nullable (RULE-006/RULE-007); every production incident
      happens to have an owner here, so no NULL bucket appears. Production identified as
      environments.environment_code = 'PROD' per the glossary. No time window and no LIMIT,
      since the question names neither (RULE-003, RULE-009). devices and sites are not on
      this path, so their default filters do not apply. Verified: 4 rows - Site Reliability
      27, Edge Platform 16, Security Engineering 7, Core Network 3.
    gold_sql: |
      SELECT t.team_name, COUNT(*) AS event_count
      FROM incident_events ie
      INNER JOIN incidents inc ON ie.incident_id = inc.incident_id
      LEFT JOIN teams t ON inc.owner_team_id = t.team_id
      INNER JOIN environments e ON inc.environment_id = e.environment_id
      WHERE e.environment_code = 'PROD'
      GROUP BY t.team_name
      ORDER BY event_count DESC

